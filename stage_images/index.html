<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorldEngine · Spherical Voronoi + Terrain Diffusion 生成流程可视化</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2b313c;
    --text: #e6e9ef;
    --muted: #9aa4b2;
    --accent: #4aa3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 32px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #13161d, #0f1115);
  }
  header h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block; margin-left: 10px; padding: 2px 10px; border-radius: 999px;
    background: #16301f; color: #5fd38a; font-size: 12px; border: 1px solid #1f5235;
  }
  main { padding: 24px 32px 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card .imgwrap {
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    min-height: 200px; padding: 10px;
  }
  .card img { max-width: 100%; height: auto; image-rendering: auto; border-radius: 4px; }
  .card .meta { padding: 12px 14px 14px; }
  .card .meta .num { color: var(--accent); font-weight: 700; font-size: 12px; letter-spacing: .5px; }
  .card .meta h3 { margin: 2px 0 4px; font-size: 15px; font-weight: 600; }
  .card .meta p { margin: 0; color: var(--muted); font-size: 12.5px; }
  footer { padding: 22px 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
  code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>WorldEngine 生成流程可视化 <span class="badge">Spherical Voronoi + Terrain Diffusion</span></h1>
  <p>板块与大陆构造由 <code>worldengine.spherical_voronoi</code> 解析生成（无 PyPlatec 物理模拟）。大陆骨架作为粗条件注入 Terrain Diffusion，渲染出真实高程（山脉、海沟）。温度/降水由真实地形驱动的物理模型计算。</p>
</header>

<main>
<div class="grid" id="grid"></div>
</main>

<footer>
  图像由 <code>tools/generate_stages_voronoi.py</code> 生成。扩散地形来自 <code>tools/diffusion_world.py</code>；气候采用自包含物理模型（纬度温度带 + 高程递减率 + 地形性降水）。
</footer>

<script>
  // Ordered pipeline stages. [filename, stage label, description]
  const stages = [
    ["01_sv_raw_plates.png", "原始微板块", "最细粒度的球面 Voronoi 种子分区（n_raw 块）。"],
    ["02_sv_merged.png", "合并大板块", "将小板块合并为 n_big 个主大陆/大洋板块（面积按参考权重 23.33/17.78/17.78/15.56/14.44/11.11；黑线 = 边界）。"],
    ["03_sv_continents.png", "生成的大陆", "陆地板块即大陆，海洋板块为海；参考 world_gen.py 权重布局。"],
    ["04_sv_boundary_types.png", "板块边界分类", "按板块相对速度分类：<b>紫=消亡(造山)</b> · <b>绿=生长(海岭)</b> · <b>橙=平移(转换)</b> · <b>浅灰=板块内部</b>。"],
    ["05_sv_elevation_relief.png", "真实地形", "Terrain Diffusion 根据大陆骨架渲染的高程：山体阴影 + 高程设色。"],
    ["06_sv_temperature.png", "温度", "物理模型：纬度温度带 + 高程递减率（6.5 °C/km）。"],
    ["07_sv_precipitation.png", "降水", "物理模型：ITCZ/西风带 + 地形性迎风坡增强。"],
    ["08_sv_ocean_mask.png", "海陆掩膜", "最终海陆二值掩膜（蓝 = 海 · 绿 = 陆）。"],
  ];

  const grid = document.getElementById("grid");
  for (const [file, label, desc] of stages) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="imgwrap">
        <img loading="lazy" src="${file}" alt="${label}" onerror="this.style.opacity=0.25; this.title='未生成: ${file}';">
      </div>
      <div class="meta">
        <div class="num">${file}</div>
        <h3>${label}</h3>
        <p>${desc}</p>
      </div>`;
    grid.appendChild(card);
  }
</script>
</body>
</html>
