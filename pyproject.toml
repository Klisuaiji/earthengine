[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earthengine"
dynamic = ["version"]
description = "架空行星自然地理生成引擎：3D 球面真实计算，2D 地图展示。"
readme = "README.md"
authors = [
    {name = "Klisuaiji"},
]
license = {text = "MIT License"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering",
]
# v2.0 依赖极简原则 (4.4): 核心运行时仅 numpy。
# scipy / Pillow 为可选加速与出图；缺失时走纯 numpy 回退路径。
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
scipy = ["scipy>=1.10.0"]
image = ["Pillow>=10.0.0"]
web = ["flask>=3.0.0"]
ai = [
    # Terrain Diffusion 增强后端（可选）：不进入核心依赖，仅 ai/ 内延迟 import
    "torch>=2.0.0",
    "diffusers>=0.20.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "sphinx>=7.2.0",
]

[project.urls]
Homepage = "https://github.com/Klisuaiji/earthengine"
Repository = "https://github.com/Klisuaiji/earthengine"

[project.scripts]
earthengine = "earthengine.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "earthengine.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["earthengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
