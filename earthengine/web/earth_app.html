<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarthEngine v2.0 · 世界工作台</title>
<style>
  :root{
    --bg:#f4f7f3; --panel:#ffffff; --border:#d7e0d4; --accent:#3d8b4e;
    --accent-soft:#e8f4e9; --text:#2c332d; --muted:#7b8579; --grid:#c9d4c6;
    --radius:4px; --shadow:0 1px 2px rgba(30,60,40,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font:12px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;
       background:var(--bg); color:var(--text); overflow:hidden;}
  .app{display:flex; flex-direction:column; height:100vh;}
  /* ---------- 顶部 ---------- */
  .topbar{display:flex; align-items:center; gap:8px; padding:6px 10px;
          background:var(--panel); border-bottom:1px solid var(--border);}
  .topbar .brand{font-weight:600; color:var(--accent); white-space:nowrap;}
  .search{display:flex; flex:1; max-width:340px; border:1px solid var(--border);
          border-radius:var(--radius); overflow:hidden; background:#fff;}
  .search input{flex:1; border:0; outline:0; padding:5px 8px; font-size:12px;}
  .search button{border:0; border-left:1px solid var(--border); background:var(--accent-soft);
                 color:var(--accent); cursor:pointer; padding:0 10px; font-size:11px;}
  .topbar .project{margin-left:auto; color:var(--muted); white-space:nowrap; font-size:11px;}
  /* ---------- 中区三栏 ---------- */
  .main{display:flex; flex:1; min-height:0;}
  .left{width:220px; background:var(--panel); border-right:1px solid var(--border);
        padding:8px; overflow:auto; display:flex; flex-direction:column; gap:10px;}
  .right{width:200px; background:var(--panel); border-left:1px solid var(--border);
         padding:8px; overflow:auto;}
  .center{flex:1; min-width:0; position:relative; background:#dfe7dc;}
  /* 缩略图 */
  .mini{width:100%; aspect-ratio:2/1; background:#eef2ec; border:1px solid var(--border);
        border-radius:var(--radius); position:relative; overflow:hidden;}
  .mini canvas{width:100%; height:100%; display:block;}
  .viewport-rect{position:absolute; border:1.5px solid var(--accent); background:rgba(61,139,78,.12); pointer-events:none;}
  /* 分区标题 */
  .sec-title{font-size:11px; color:var(--muted); text-transform:uppercase;
             letter-spacing:.04em; margin-bottom:4px;}
  /* 工作模式 */
  .modes{display:flex; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .mode{flex:1; text-align:center; padding:5px 0; cursor:pointer; background:#fff; color:var(--muted);}
  .mode.active{background:var(--accent); color:#fff; font-weight:600;}
  /* 图层列表 */
  .layer-row{display:flex; align-items:center; gap:6px; padding:4px 6px; cursor:pointer;
             border-radius:var(--radius);}
  .layer-row:hover{background:var(--accent-soft);}
  .layer-row.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .layer-row .dot{width:8px; height:8px; border-radius:2px; flex:none;}
  /* 导入按钮 */
  .btn{width:100%; padding:5px 8px; border:1px solid var(--border); border-radius:var(--radius);
       background:#fff; cursor:pointer; font-size:11px; color:var(--text);}
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  /* 工具 */
  .tool{display:flex; align-items:center; gap:6px; padding:5px 6px; cursor:pointer;
        border-radius:var(--radius); color:var(--text);}
  .tool:hover{background:var(--accent-soft);}
  .tool.active{background:var(--accent); color:#fff;}
  .tool .t{flex:1;}
  .tool .flag{font-size:10px; color:var(--muted);}
  .tool.active .flag{color:#d9f0dc;}
  /* 生成参数 */
  .field{margin-bottom:6px;}
  .field label{display:block; color:var(--muted); margin-bottom:2px; font-size:11px;}
  .field input{border:1px solid var(--border); border-radius:var(--radius); padding:4px 6px;
               width:100%; font-size:12px;}
  /* 中央画布 */
  #map{position:absolute; inset:0; width:100%; height:100%; display:block;
       background:#dfe7dc; cursor:grab;}
  #map.dragging{cursor:grabbing;}
  #layer-label{position:absolute; left:8px; bottom:8px; background:rgba(255,255,255,.85);
               border:1px solid var(--border); border-radius:var(--radius); padding:2px 8px;
               font-size:11px; color:var(--muted);}
  #hud{position:absolute; right:8px; top:8px; background:rgba(255,255,255,.9);
       border:1px solid var(--border); border-radius:var(--radius); padding:4px 8px;
       font-size:11px; color:var(--muted); min-width:150px;}
  /* 底部状态栏 */
  .statusbar{display:flex; gap:18px; padding:5px 10px; background:var(--panel);
             border-top:1px solid var(--border); color:var(--muted); font-size:11px;
             align-items:center; flex-wrap:wrap;}
  .statusbar .k{color:var(--muted);}
  .statusbar .v{color:var(--text); font-variant-numeric:tabular-nums;}
  .statusbar .stage{color:var(--accent); font-weight:600;}
  .statusbar .err{color:#c0392b;}
</style>
</head>
<body>
<div class="app">
  <!-- 顶部 -->
  <div class="topbar">
    <span class="brand">EarthEngine</span>
    <div class="search">
      <input id="q" placeholder="坐标定位（如 30N 120E，回车）">
      <button id="qbtn">定位</button>
    </div>
    <span class="project" id="project">未加载世界</span>
  </div>

  <div class="main">
    <!-- 左栏 -->
    <div class="left">
      <div class="sec-title">世界缩略图</div>
      <div class="mini"><canvas id="mini"></canvas><div class="viewport-rect" id="vrect"></div></div>

      <div class="sec-title">数据</div>
      <button class="btn" id="importBtn" disabled title="规划中">导入数据（规划中）</button>

      <div class="sec-title">工作模式</div>
      <div class="modes" id="modes"></div>

      <div class="sec-title">图层</div>
      <div id="layerlist"></div>

      <div class="sec-title">生成参数</div>
      <div class="field"><label>Seed</label><input id="seedIn" type="number" value="12345"></div>
      <div class="field"><label>分辨率 W×H（W=2H）</label><input id="whIn" value="1024×512"></div>
      <button class="btn primary" id="genBtn">生成世界</button>
    </div>

    <!-- 中央 -->
    <div class="center">
      <canvas id="map"></canvas>
      <div id="layer-label">—</div>
      <div id="hud">未加载</div>
    </div>

    <!-- 右栏 -->
    <div class="right">
      <div class="sec-title">地图工具</div>
      <div id="tools"></div>
      <div class="sec-title" style="margin-top:12px">图例</div>
      <div id="legend" style="color:var(--muted); font-size:11px">—</div>
    </div>
  </div>

  <!-- 底部状态栏 -->
  <div class="statusbar">
    <span><span class="k">Lat</span> <span class="v" id="st-lat">—</span></span>
    <span><span class="k">Lon</span> <span class="v" id="st-lon">—</span></span>
    <span><span class="k">Zoom</span> <span class="v" id="st-zoom">—</span></span>
    <span><span class="k">Scale</span> <span class="v" id="st-scale">—</span></span>
    <span><span class="k">Resolution</span> <span class="v" id="st-res">—</span></span>
    <span><span class="k">Seed</span> <span class="v" id="st-seed">—</span></span>
    <span class="stage" id="st-stage">就绪</span>
    <span id="st-status" style="margin-left:auto"></span>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const META={modes:["world","terrain","data"],layers:{},tools:[]};
let WORLD=null;
let curLayer="land_sea", curMode="world";
const view={scale:1,ox:0,oy:0};
let dragging=false,lastX=0,lastY=0;

const canvas=$("map"),ctx=canvas.getContext("2d");
const mini=$("mini"),mctx=mini.getContext("2d");

function layerForMode(mode){return {world:["land_sea","plates"],terrain:["terrain"],data:["biome","temperature","precipitation"]}[mode]||[];}

async function loadMeta(){
  try{
    const r=await fetch("/api/meta"); const j=await r.json();
    if(j.success){Object.assign(META,j.data); buildModes(); buildTools(); buildLayers();}
  }catch(e){setStatus("后端不可达: "+e,"err");}
}
function buildModes(){
  const box=$("modes"); box.innerHTML="";
  META.modes.forEach(m=>{
    const d=document.createElement("div"); d.className="mode"+(m===curMode?" active":"");
    d.textContent=m==="world"?"世界":m==="terrain"?"地形":"数据";
    d.onclick=()=>{curMode=m;document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
                   d.classList.add("active"); buildLayers();};
    box.appendChild(d);
  });
}
function buildTools(){
  const box=$("tools"); box.innerHTML="";
  const names={navigate:"导航",select:"选择",inspect:"检查",plates:"板块",terrain:"地形",rivers:"河流",measure:"测量"};
  META.tools.forEach(t=>{
    const d=document.createElement("div"); d.className="tool"+(t==="navigate"?" active":"");
    const planning=["select","inspect","plates","terrain","rivers","measure"].includes(t);
    d.innerHTML=`<span class="t">${names[t]||t}</span>${planning?`<span class="flag">规划中</span>`:""}`;
    if(planning){d.style.cursor="not-allowed";d.onclick=()=>setStatus(`「${names[t]}」规划中`,"");}
    else d.onclick=()=>{document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));d.classList.add("active");};
    box.appendChild(d);
  });
}
function buildLayers(){
  const box=$("layerlist"); box.innerHTML="";
  layerForMode(curMode).forEach(key=>{
    const l=META.layers[key]||{label:key,group:curMode};
    const d=document.createElement("div"); d.className="layer-row"+(key===curLayer?" active":"");
    d.innerHTML=`<span class="dot" style="background:${dotColor(key)}"></span><span>${l.label}</span>`;
    d.onclick=()=>{curLayer=key; buildLayers(); $("layer-label").textContent=(l.label)+" · "+l.group; drawMap();};
    box.appendChild(d);
  });
}
function dotColor(k){return {land_sea:"#3d8b4e",plates:"#a0522d",terrain:"#7a8f6b",biome:"#2e8b57",temperature:"#c0392b",precipitation:"#2980b9"}[k]||"#999";}

$("genBtn").onclick=async()=>{
  const seed=parseInt($("seedIn").value||"12345",10);
  const m=$("whIn").value.trim().split(/[x×]/);
  const w=parseInt(m[0]),h=parseInt(m[1]);
  if(isNaN(w)||isNaN(h)||w!==2*h){setStatus("分辨率需 W=2×H","err");return;}
  $("genBtn").disabled=true; $("st-stage").textContent="生成中…";
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({seed,width:w,height:h})});
    const j=await r.json();
    if(!j.success){setStatus("生成失败: "+(j.error?j.error.message:"未知"),"err");
      $("st-stage").textContent="失败"; return;}
    WORLD=j.data; curLayer="land_sea";
    $("st-res").textContent=w+"×"+h; $("st-seed").textContent=seed;
    $("project").textContent=`seed ${seed} · 陆地 ${(WORLD.land*100).toFixed(1)}%`;
    $("st-stage").textContent=`阶段 ${WORLD.stages.length} · ${WORLD.validation.passed?"通过":"有错误"}`;
    setStatus(`生成 ${WORLD.elapsed}s · errors=${WORLD.validation.errors.length}`,
              WORLD.validation.passed?"":"err");
    const hv=[WORLD.validation.errors,WORLD.validation.warnings].flat().map(x=>x.message).join("; ");
    $("hud").textContent=WORLD.validation.passed?"验证通过":(hv||"验证有误");
    buildLayers(); resetView(); drawMap(); drawMini();
  }catch(e){setStatus("请求失败: "+e,"err"); $("st-stage").textContent="失败";}
  finally{$("genBtn").disabled=false;}
};

function resizeCanvas(){const r=canvas.parentElement.getBoundingClientRect();
  canvas.width=Math.max(1,r.width);canvas.height=Math.max(1,r.height);}
function resetView(){view.scale=1;view.ox=0;view.oy=0;}

function drawMap(){
  const w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#dfe7dc"; ctx.fillRect(0,0,w,h);
  if(!WORLD){ctx.fillStyle="#7b8579";ctx.font="13px sans-serif";ctx.textAlign="center";
    ctx.fillText("点击「生成世界」开始…",w/2,h/2); return;}
  const img=WORLD.images[curLayer]; if(!img) return;
  const im=new Image();
  im.onload=()=>{
    const iw=im.naturalWidth,ih=im.naturalHeight;
    ctx.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
    ctx.imageSmoothingEnabled=true; ctx.drawImage(im,0,0,iw,ih);
    ctx.strokeStyle="rgba(80,100,90,0.18)"; ctx.lineWidth=1;
    for(let x=0;x<=12;x++){ctx.beginPath();ctx.moveTo(iw*x/12,0);ctx.lineTo(iw*x/12,ih);ctx.stroke();}
    for(let y=0;y<=6;y++){ctx.beginPath();ctx.moveTo(0,ih*y/6);ctx.lineTo(iw,ih*y/6);ctx.stroke();}
    ctx.setTransform(1,0,0,1,0,0); updateStatus();
  };
  im.src=img;
}
canvas.addEventListener("wheel",e=>{e.preventDefault(); if(!WORLD)return;
  const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
  const k=e.deltaY<0?1.2:1/1.2; const ns=Math.max(0.05,Math.min(60,view.scale*k));
  view.ox=mx-(mx-view.ox)*(ns/view.scale); view.oy=my-(my-view.oy)*(ns/view.scale);
  view.scale=ns; drawMap(); drawMini();});
canvas.addEventListener("mousedown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add("dragging");});
window.addEventListener("mousemove",e=>{if(!dragging)return;view.ox+=e.clientX-lastX;view.oy+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;drawMap();drawMini();});
window.addEventListener("mouseup",()=>{dragging=false;canvas.classList.remove("dragging");});

function drawMini(){
  if(!WORLD){mctx.clearRect(0,0,mini.width,mini.height);return;}
  const img=WORLD.images["land_sea"]; if(!img) return;
  const im=new Image();
  im.onload=()=>{
    const w=mini.clientWidth,h=mini.clientHeight; mini.width=w; mini.height=h;
    mctx.clearRect(0,0,w,h); mctx.fillStyle="#eef2ec"; mctx.fillRect(0,0,w,h);
    mctx.drawImage(im,0,0,w,h);
    const iw=im.naturalWidth,ih=im.naturalHeight;
    const sx=view.ox/view.scale, sy=view.oy/view.scale;
    const vw=canvas.width/view.scale, vh=canvas.height/view.scale;
    const px=sx/iw*w, py=sy/ih*h, pw=vw/iw*w, ph=vh/ih*h;
    const r=$("vrect"); r.style.left=Math.max(0,Math.min(w-pw,px))+"px";
    r.style.top=Math.max(0,Math.min(h-ph,py))+"px";
    r.style.width=Math.max(4,pw)+"px"; r.style.height=Math.max(2,ph)+"px";
  };
  im.src=img;
}
function updateStatus(){
  if(!WORLD)return;
  const cx=(-view.ox+canvas.width/2)/view.scale, cy=(-view.oy+canvas.height/2)/view.scale;
  $("st-lat").textContent=(90-cy/WORLD.h*180).toFixed(2)+"°";
  $("st-lon").textContent=(cx/WORLD.w*360-180).toFixed(2)+"°";
  $("st-zoom").textContent=view.scale.toFixed(2)+"×";
  const kmPx=40075/WORLD.w/view.scale;
  $("st-scale").textContent=kmPx>=1?(kmPx.toFixed(1)+" km/px"):((kmPx*1000).toFixed(1)+" m/px");
}
function setStatus(msg,cls){const s=$("st-status"); s.textContent=msg; s.className=cls||"";}

function parseCoord(str){
  const m=str.trim().match(/^(-?[\d.]+)\s*(N|S)?[\s,]*(-?[\d.]+)\s*(E|W)?$/i);
  if(!m)return null;
  let lat=parseFloat(m[1]),lon=parseFloat(m[3]);
  if(m[2]&&m[2].toUpperCase()==="S")lat=-lat; if(m[4]&&m[4].toUpperCase()==="W")lon=-lon;
  if(lat<-90||lat>90||lon<-180||lon>180)return null;
  return {lat,lon};
}
function goTo(lat,lon){
  if(!WORLD){setStatus("先生成世界再定位","err");return;}
  const cx=(lon+180)/360*WORLD.w, cy=(90-lat)/180*WORLD.h;
  view.ox=canvas.width/2-cx*view.scale; view.oy=canvas.height/2-cy*view.scale;
  drawMap(); drawMini();
}
$("qbtn").onclick=()=>{const c=parseCoord($("q").value); if(!c){setStatus("坐标格式如：30N 120E","err");return;} goTo(c.lat,c.lon); setStatus(`已定位 ${c.lat}° ${c.lon}°`,"");};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")$("qbtn").click();});

window.addEventListener("resize",()=>{resizeCanvas(); drawMap(); drawMini();});
(async function boot(){resizeCanvas(); await loadMeta(); drawMap(); drawMini();})();
</script>
</body>
</html>
